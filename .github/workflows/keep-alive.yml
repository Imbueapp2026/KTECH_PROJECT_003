name: Database Keep-Alive Ping

on:
  schedule:
    # Runs every 3 days at 04:00 UTC (well within Supabase's 7-day pause window)
    - cron: '0 4 */3 * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database via API
        run: |
          if [ -n "${{ secrets.PUBLIC_SITE_URL }}" ]; then
            TARGET_URL="${{ secrets.PUBLIC_SITE_URL }}/api/ping"
          elif [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ] && [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" ]; then
            TARGET_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/categories?select=id&limit=1"
          else
            echo "Skipping: Neither PUBLIC_SITE_URL nor SUPABASE_URL configured."
            exit 0
          fi
          
          echo "Pinging $TARGET_URL to keep database active..."
          if [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" ]; then
            curl -s -f -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" "$TARGET_URL" || curl -s "$TARGET_URL"
          else
            curl -s -f "$TARGET_URL" || true
          fi
          echo "Database ping completed."
